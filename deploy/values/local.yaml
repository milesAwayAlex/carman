# The local cluster: k3s in a virtual machine on a laptop. Its service load
# balancer publishes the memory service on the machine's port 8377, and the
# virtual machine forwards a LoadBalancer's port to the laptop's loopback
# address, so the laptop reaches the service at http://127.0.0.1:8377 and
# nothing on the network does.
memory:
  service:
    type: LoadBalancer

# The egress proxy holds a credential for the code host (its API, and git
# over HTTPS) and for the issue tracker's MCP endpoint. Each is put in the cluster by a pipe, as the
# whole header value:
#   printf 'Bearer %s' "$(PROGRAM-THAT-PRINTS-THE-TOKEN)" | scripts/deploy.sh CONTEXT secret carman-egress github
egress:
  credentials:
    - {host: api.github.com, key: github}
    # git over HTTPS goes to another host and wants the token as a password:
    #   printf 'Basic %s' "$(printf 'x-access-token:%s' "$(TOKEN)" | base64 | tr -d '\n')" | ... secret carman-egress github-git
    - {host: github.com, key: github-git}
    - {host: mcp.linear.app, key: linear}
