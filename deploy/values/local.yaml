# The local cluster: k3s in a virtual machine on a laptop. Its service load
# balancer publishes the memory service on the machine's port 8377, and the
# virtual machine forwards a LoadBalancer's port to the laptop's loopback
# address, so the laptop reaches the service at http://127.0.0.1:8377 and
# nothing on the network does.
memory:
  service:
    type: LoadBalancer
# The laptop comes in through the cluster's load balancer, which is not a pod
# of this namespace.
isolated: false

# On a laptop the proxy's way out is the laptop's own, private networks
# included (a VPN's routes, for one), and an agent may need them. What stays
# closed is the cluster itself: k3s's pod and service ranges, and link-local.
# The node's own network belongs here too and differs by machine: a service's
# address is the node's by the time the rule is applied, so without it the
# cluster's API stays reachable. Give the whole list in .local/values.yaml.
egress:
  closedTo: [10.42.0.0/16, 10.43.0.0/16, 169.254.0.0/16]

# Which hosts the egress proxy holds a credential for belongs to the
# installation: list them under egress.credentials in the git-ignored
# .local/values.yaml, which scripts/deploy.sh adds to these values. Each
# credential is put in the cluster by a pipe, as the whole header value:
#   printf 'Bearer %s' "$(PROGRAM-THAT-PRINTS-THE-TOKEN)" | scripts/deploy.sh CONTEXT secret egress-credentials KEY
