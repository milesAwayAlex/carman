{{- if .Values.dispatcher.enabled }}
{{- /* Templates the dispatcher starts (ADR 0043). Their CronJobs never run
on their own: they are suspended, with a schedule that is never used. */ -}}
{{- $templates := list }}
{{- /* A notice to the owner: the installation's notify-owner, with the words
the dispatcher put in the task's payload. */ -}}
{{- $templates = append $templates (dict "name" "notify" "cronjob" "notify" "deadlineSeconds" 300
    "command" (list "sh" "-c" "exec notify-owner --urgency \"$TASK_URGENCY\" --importance \"$TASK_IMPORTANCE\" \"$TASK_TITLE\" \"$TASK_TEXT\"")
    "resources" (dict "requests" (dict "cpu" "20m" "memory" "64Mi") "limits" (dict "memory" "256Mi"))) }}
{{- if .Values.usage.enabled }}
{{- $templates = append $templates (dict "name" "usage" "cronjob" "agent-usage" "deadlineSeconds" .Values.usage.deadlineSeconds
    "command" (list "usage-reading") "env" (dict "USAGE_MODELS" (include "usage.models" .)) "resources" .Values.usage.resources) }}
{{- end }}
{{- range $templates }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .cronjob }}
  namespace: {{ $.Release.Namespace }}
spec:
  schedule: "0 0 1 1 *"
  timeZone: "Etc/UTC"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .deadlineSeconds }}
      ttlSecondsAfterFinished: {{ $.Values.agent.keepFinishedSeconds }}
      template:
        metadata:
          labels:
            app: {{ .cronjob }}
            app.kubernetes.io/component: agent
            {{- with (include "pod.labels" $) }}{{ . | trim | nindent 12 }}{{- end }}
        spec:
          {{- include "agent.podspec" (dict "root" $ "agent" .) | nindent 10 }}
{{- end }}
{{- /* A watch's job (ADR 0063): one look at its source, told to the
dispatcher, which knows it by its name, watch-NAME, and its pod's own
token. It has no model, no memory and no credential of its own: only the
way out through the egress proxy that agents have. */ -}}
{{- range .Values.dispatcher.watches }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: watch-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  schedule: "0 0 1 1 *"
  timeZone: "Etc/UTC"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: watch-{{ .name }}
            app.kubernetes.io/component: agent
            {{- with (include "pod.labels" $) }}{{ . | trim | nindent 12 }}{{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: agent
          automountServiceAccountToken: false
          {{- with (include "pod.placement" $) }}{{ . | trim | nindent 10 }}{{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: watch
              {{- include "agent.jobImage" $ | nindent 14 }}
              command: ["dispatcher", "source"]
              env:
                - name: AGENT_NAME
                  value: watch-{{ .name }}
                - name: DISPATCHER_URL
                  value: http://dispatcher.{{ $.Release.Namespace }}.svc:{{ $.Values.dispatcher.service.port }}
                - name: WATCH
                  value: {{ toJson (omit . "cron" "timeZone" "priority") | quote }}
                {{- if $.Values.egress.enabled }}
                - name: HTTPS_PROXY
                  value: http://egress:3128
                - name: NO_PROXY
                  value: cmem,localhost,127.0.0.1,.svc,.svc.cluster.local
                - name: EGRESS_CA
                  value: /etc/agent/egress/ca.crt
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - name: dispatcher-identity
                  mountPath: /var/run/secrets/dispatcher
                  readOnly: true
                {{- if $.Values.egress.enabled }}
                - name: egress-ca
                  mountPath: /etc/agent/egress
                  readOnly: true
                {{- end }}
          volumes:
            - name: dispatcher-identity
              projected:
                sources:
                  - serviceAccountToken:
                      audience: dispatcher
                      expirationSeconds: 3600
                      path: token
            {{- if $.Values.egress.enabled }}
            - name: egress-ca
              configMap:
                name: egress-ca
                optional: true
            {{- end }}
{{- end }}
{{- end }}
