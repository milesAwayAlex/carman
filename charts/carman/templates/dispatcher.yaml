{{- if .Values.dispatcher.enabled }}
{{- $db := .Values.dispatcher.database }}
{{- $local := not $db.host }}
# The dispatcher (ADR 0042). Inside the cluster it is
# http://dispatcher:{{ .Values.dispatcher.service.port }} in this namespace.
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.dispatcher.service.type }}
  selector:
    app: dispatcher
  ports:
    - name: http
      port: {{ .Values.dispatcher.service.port }}
      targetPort: http
---
{{ include "pod.account" (dict "name" "dispatcher" "root" .) }}
---
# What the dispatcher may do in its namespace, and nothing more: make Jobs
# from the CronJobs' templates, follow every Job to its end, read every
# CronJob's schedule to know what runs to expect, and read a Job's pods for
# the exit code and why it failed, with the last lines of its log. It deletes nothing and changes nothing it
# did not make.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    # get: which agent's pod a caller is, and whether a session's pod is
    # still there (ADR 0045).
    verbs: ["list", "get"]
  - apiGroups: [""]
    # A failed Job's last lines, kept in the dispatcher's log as why it
    # failed: read-only, the pods of its own namespace.
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: {{ .Release.Namespace }}
---
# One replica. A second for a moment, during a rollout, is safe: instances
# on one database start each attempt once and record each transition once
# (ADR 0039), and the watchers' events have IDs the log refuses twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
        {{- with (include "pod.labels" .) }}{{ . | trim | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: dispatcher
      # Its own account is how it talks to the cluster's API (the Role above).
      automountServiceAccountToken: true
      {{- with (include "pod.placement" .) }}{{ . | trim | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dispatcher
          image: {{ required "dispatcher.image is required" .Values.dispatcher.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DISPATCHER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dispatcher.tokensSecret }}
                  key: DISPATCHER_TOKENS
            # The owner's token is not on the cluster, only its hash
            # (ADR 0051); the owner's client runs on the owner's machine.
            - name: DISPATCHER_OWNER_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dispatcher.tokensSecret }}
                  key: owner-sha256
            - name: DISPATCHER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISPATCHER_BUILD
              value: {{ .Values.dispatcher.image | quote }}
            - name: DISPATCHER_MAX_RUNNING
              value: {{ .Values.dispatcher.maxRunning | quote }}
            # Places kept for scheduled work, of so high a priority (ADR 0059).
            - name: DISPATCHER_RESERVE_PLACES
              value: {{ .Values.dispatcher.reserve.places | quote }}
            - name: DISPATCHER_RESERVE_FROM
              value: {{ .Values.dispatcher.reserve.from | quote }}
            - name: DISPATCHER_RETENTION
              value: {{ .Values.dispatcher.retention | quote }}
            - name: DISPATCHER_RETENTION_UNOWNED
              value: {{ .Values.dispatcher.retentionUnowned | quote }}
            - name: DISPATCHER_RETENTION_MESSAGES
              value: {{ .Values.dispatcher.messages.retention | quote }}
            - name: DISPATCHER_MESSAGE_RUNS
              value: {{ .Values.dispatcher.messages.runsPerSender | default 24 | quote }}
            - name: DISPATCHER_MESSAGE_RUNS_PERIOD
              value: {{ .Values.dispatcher.messages.runsPeriod | default "3h" | quote }}
            - name: DISPATCHER_MESSAGE_AGAIN_AFTER_LIMIT
              value: {{ .Values.dispatcher.messages.againAfterLimit | default false | quote }}
            - name: DISPATCHER_MESSAGE_WAIT_NOTICE
              value: {{ .Values.dispatcher.messages.waitNotice | default "10m" | quote }}
            # What it starts by itself (ADR 0043): the schedules listed, the
            # agents it schedules, and the usage reading.
            - name: DISPATCHER_SCHEDULES
              value: {{ include "dispatcher.schedules" . | quote }}
            # Who may write to each agent besides the owner (ADR 0047).
            - name: DISPATCHER_WRITERS
              value: {{ include "dispatcher.writers" . | quote }}
            # The owner's machine, whose sessions hold the host token (ADR 0049).
            - name: DISPATCHER_PLACE
              value: {{ .Values.dispatcher.host.place | quote }}
            - name: DISPATCHER_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dispatcher.tokensSecret }}
                  key: host
                  optional: true
            - name: DISPATCHER_EXPECT_GRACE
              value: {{ .Values.dispatcher.expect.grace | quote }}
            - name: DISPATCHER_NOTICES
              value: {{ ternary "on" "off" .Values.dispatcher.notices.enabled | quote }}
            - name: DISPATCHER_NOTICE_CLASS
              value: {{ .Values.dispatcher.notices.class | quote }}
            - name: DISPATCHER_CONTEXT_NAME
              value: {{ .Values.dispatcher.notices.context | quote }}
            # Triggers (ADR 0063): rules, the watches' names, hooks and their secrets.
            {{- with .Values.dispatcher.rules }}
            - name: DISPATCHER_RULES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with (include "dispatcher.watches" .) }}
            - name: DISPATCHER_WATCHES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dispatcher.hooks }}
            - name: DISPATCHER_HOOKS
              value: {{ toJson . | quote }}
            {{- range $name, $_ := . }}
            - name: DISPATCHER_HOOK_SECRET_{{ $name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dispatcher.hooksSecret }}
                  key: {{ $name }}
            {{- end }}
            {{- end }}
            - name: DISPATCHER_NOTICE_WITHHOLD
              value: {{ join "\n" (.Values.dispatcher.notices.withhold | default list) | quote }}
            # The improvement loop's settings (ADR 0058).
            - name: DISPATCHER_IMPROVEMENT
              value: {{ include "dispatcher.improvement" . | quote }}
            {{- /* Agents' limits at the proxy (ADR 0064). */}}
            {{- $limits := dict }}
            {{- range $a := .Values.agents }}
            {{- with $a.proxyLimit }}
            {{- $_ := set $limits $a.name . }}
            {{- end }}
            {{- end }}
            {{- with .Values.dreamer.proxyLimit }}
            {{- $_ := set $limits "dreamer" . }}
            {{- end }}
            {{- if $limits }}
            - name: DISPATCHER_PROXY_LIMITS
              value: {{ toJson $limits | quote }}
            {{- end }}
            {{- with .Values.dispatcher.admission }}
            {{- if .enabled }}
            - name: DISPATCHER_ADMISSION
              value: "on"
            - name: DISPATCHER_ADMISSION_BELOW
              value: {{ .below | quote }}
            - name: DISPATCHER_ADMISSION_ABOVE
              value: {{ .above | quote }}
            - name: DISPATCHER_ADMISSION_MAX_AGE
              value: {{ .maxAge | quote }}
            - name: DISPATCHER_ADMISSION_MODE
              value: {{ .mode | default "threshold" | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.dispatcher.pace }}
            - name: DISPATCHER_PACE_TARGET
              value: {{ .target | quote }}
            - name: DISPATCHER_PACE_SOON
              value: {{ .soon | quote }}
            - name: DISPATCHER_PACE_ROOM
              value: {{ ternary "on" "off" (.room | default false) | quote }}
            - name: DISPATCHER_PACE_ROOM_MIN
              value: {{ .roomMin | quote }}
            {{- end }}
            # The database, as libpq's variables: the service and pg_dump
            # both read them, and the password is in no address.
            - name: PGHOST
              value: {{ ternary "dispatcher-db" $db.host $local | quote }}
            - name: PGPORT
              value: {{ $db.port | quote }}
            - name: PGDATABASE
              value: {{ $db.name | quote }}
            - name: PGUSER
              value: {{ $db.user | quote }}
            - name: PGSSLMODE
              value: {{ ternary "disable" $db.sslmode $local | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secret }}
                  key: password
          ports:
            - name: http
              containerPort: 8379
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Where a dump is made before it is sent.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $local }}
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-db
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: dispatcher-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
{{ include "pod.account" (dict "name" "dispatcher-db" "root" .) }}
---
# The dispatcher's own Postgres, as the memory service has its own library:
# nothing else writes to it. Its password is made by scripts/deploy.sh.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dispatcher-db
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: dispatcher-db
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher-db
  template:
    metadata:
      labels:
        app: dispatcher-db
        {{- with (include "pod.labels" .) }}{{ . | trim | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: dispatcher-db
      automountServiceAccountToken: false
      {{- with (include "pod.placement" .) }}{{ . | trim | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        # The image's postgres user.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ $db.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ $db.user | quote }}
            - name: POSTGRES_DB
              value: {{ $db.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secret }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $db.user | quote }}, "-d", {{ $db.name | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $db.user | quote }}, "-d", {{ $db.name | quote }}]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $db.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.podLabels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $db.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $db.storage }}
---
# Only the dispatcher reaches its database. The nightly backup asks the
# dispatcher for the dump instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcher-db-admits-only-the-dispatcher
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: dispatcher-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dispatcher
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- if and .Values.isolated (ne .Values.dispatcher.service.type "ClusterIP") }}
{{- if not .Values.dispatcher.service.admitFrom }}
{{- fail "dispatcher.service.admitFrom: this namespace is isolated, so a dispatcher reached from outside the cluster needs the addresses it is reached from" }}
{{- end }}
---
# The owner's machine reaches the dispatcher through the load balancer
# (ADR 0049), from these addresses only, on the service's port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcher-admits-the-owners-machine
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: dispatcher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "admit.peers" .Values.dispatcher.service.admitFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8379}
{{- end }}
{{- end }}
