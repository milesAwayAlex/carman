# The dreamer: the consolidation and distilling routines, run on a schedule
# beside the memory they tidy (ADR 0027). It needs a model credential in the
# secret named by agent.modelSecret, which is put there on purpose (ADR 0028).
{{ include "pod.account" (dict "name" "dreamer" "root" .) }}
{{- /* The MCP tools the dreamer may call, as the harness names them. */ -}}
{{- $tools := list }}
{{- range $server, $names := .Values.dreamer.mcpTools }}
{{- if not (hasKey ($.Values.dreamer.mcp | default dict) $server) }}{{ fail (printf "dreamer.mcpTools names %s, which is not among dreamer.mcp" $server) }}{{ end }}
{{- range $names }}{{ $tools = append $tools (printf "mcp__%s__%s" $server .) }}{{ end }}
{{- end }}
{{- with .Values.dreamer.mcp }}
---
{{ include "agent.mcpConfigMap" (dict "name" "dreamer-mcp" "mcp" . "root" $) }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dreamer
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.dreamer.schedule | quote }}
  timeZone: "Etc/UTC"
  suspend: {{ .Values.dreamer.suspend }}
  # A cluster that was not running at the scheduled time (a laptop asleep)
  # starts the run when it is back, if that is within this long.
  startingDeadlineSeconds: {{ .Values.dreamer.catchUpSeconds }}
  # A run reads the whole library before it changes anything; two at once
  # would each act on what the other is about to change.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.dreamer.deadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.agent.keepFinishedSeconds }}
      template:
        metadata:
          labels:
            app: dreamer
            app.kubernetes.io/component: agent
            {{- with (include "pod.labels" .) }}{{ . | trim | nindent 12 }}{{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: dreamer
          automountServiceAccountToken: false
          {{- with (include "pod.placement" .) }}{{ . | trim | nindent 10 }}{{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: dreamer
              {{- include "agent.jobImage" . | nindent 14 }}
              args: {{ toJson .Values.dreamer.routines }}
              env:
                - name: CMEM_URL
                  value: http://cmem:{{ .Values.memory.service.port }}
                # The consolidation role, and nothing wider.
                - name: CMEM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.memory.tokensSecret }}
                      key: dreamer
                - name: CLAUDE_CODE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.agent.modelSecret }}
                      key: token
                # A consolidation pass reads the whole library itself; the
                # hook that shows working sessions their memory is off for it.
                - name: CMEM_HOOK
                  value: "off"
                - name: CMEM_ROUTINE_MODELS
                  value: {{ join "," .Values.dreamer.models | quote }}
                {{- range $routine, $models := .Values.dreamer.modelsFor }}
                - name: CMEM_ROUTINE_MODELS_{{ $routine | upper | replace "-" "_" }}
                  value: {{ join "," $models | quote }}
                {{- end }}
                - name: CMEM_ROUTINE_BUDGET_USD
                  value: {{ .Values.dreamer.budgetUSD | quote }}
                {{- if .Values.dreamer.definitions }}
                # Beside memory it may read what each agent is and the
                # installation's routines, and nothing else (ADR 0044).
                - name: CMEM_ROUTINE_READ
                  value: /etc/agent/definitions
                {{- end }}
                {{- if .Values.dreamer.mcp }}
                # MCP servers, of whose tools it may call only these.
                - name: CMEM_ROUTINE_MCP_CONFIG
                  value: /etc/agent/mcp/mcp.json
                - name: CMEM_ROUTINE_MCP_TOOLS
                  value: {{ join "," $tools | quote }}
                {{- end }}
                {{- if .Values.dispatcher.enabled }}
                # Where each routine's run records what it used (ADR 0043).
                - name: AGENT_NAME
                  value: dreamer
                - name: DISPATCHER_URL
                  value: http://dispatcher.{{ .Release.Namespace }}.svc:{{ .Values.dispatcher.service.port }}
                - name: DISPATCHER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.dispatcher.tokensSecret }}
                      key: agent
                {{- end }}
                {{- if .Values.egress.enabled }}
                # Everything outside the cluster is reached through the
                # proxy; the memory service is beside it and reached directly.
                - name: HTTPS_PROXY
                  value: http://egress:3128
                - name: NO_PROXY
                  value: cmem,localhost,127.0.0.1
                # The authority the proxy's certificates come from, trusted
                # beside the public ones.
                - name: EGRESS_CA
                  value: /etc/agent/egress/ca.crt
                {{- end }}
              volumeMounts:
                - name: home
                  mountPath: /home/agent
                # The installation's commands. The routines may run only the
                # memory command; what runs them tells the owner when a
                # report has questions for them (run-routine).
                - name: tools
                  mountPath: /etc/agent/bin
                  readOnly: true
                {{- if .Values.dreamer.definitions }}
                - name: definitions
                  mountPath: /etc/agent/definitions
                  readOnly: true
                {{- end }}
                {{- if .Values.dreamer.mcp }}
                - name: mcp
                  mountPath: /etc/agent/mcp
                  readOnly: true
                {{- end }}
                {{- if .Values.agent.sessionStorage }}
                # Its conversations are kept as every job's are, for the
                # owner to read or pick up from an interactive agent.
                - name: sessions
                  mountPath: /var/lib/agent/conversations
                  subPath: dreamer
                {{- end }}
                {{- if .Values.egress.enabled }}
                - name: egress-ca
                  mountPath: /etc/agent/egress
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.dreamer.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: home
              emptyDir: {}
            - name: tools
              configMap:
                name: tools
                optional: true
                defaultMode: 0555
            {{- if .Values.dreamer.definitions }}
            # One directory: agents.yaml, and each of the installation's
            # routines as NAME.md.
            - name: definitions
              projected:
                sources:
                  - configMap:
                      name: agent-definitions
                  - configMap:
                      name: routines
                      optional: true
            {{- end }}
            {{- if .Values.dreamer.mcp }}
            - name: mcp
              configMap:
                name: dreamer-mcp
            {{- end }}
            {{- if .Values.agent.sessionStorage }}
            - name: sessions
              persistentVolumeClaim:
                claimName: agent-sessions
            {{- end }}
            {{- if .Values.egress.enabled }}
            - name: egress-ca
              configMap:
                name: egress-ca
                optional: true
            {{- end }}
