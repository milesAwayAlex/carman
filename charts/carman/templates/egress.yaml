{{- if .Values.egress.enabled }}
{{- $creds := .Values.egress.credentials }}
{{- $renewals := .Values.egress.renewals }}
{{- $renewed := list }}{{- range $renewals }}{{- $renewed = append $renewed .key }}{{- range (.also | default list) }}{{- $renewed = append $renewed . }}{{- end }}{{- end }}
{{- $hosts := list }}{{- $keys := list }}
{{- range $creds }}{{- if not (has .host $hosts) }}{{- $hosts = append $hosts .host }}{{- end }}{{- if not (has .key $renewed) }}{{- $keys = append $keys .key }}{{- end }}{{- end }}
{{- $model := include "egress.model" . }}
{{- if $model }}{{- $hosts = append $hosts .Values.egress.model.host }}{{- end }}
{{- $trials := and $model .Values.egress.model.trials.enabled }}
{{- if and .Values.egress.model.trials.enabled (not $model) }}{{ fail "egress.model.trials needs the model's credential at the proxy (agent.modelCredential: proxy or both)" }}{{ end }}
{{- if and $trials (not .Values.agent.sandbox.namespace) }}{{ fail "egress.model.trials needs agent.sandbox.namespace, where trials stand" }}{{ end }}
# The egress proxy: the one way out of the cluster for agent pods (ADR 0031).
# Today it passes every connection through and logs where it went. It is
# where credentials for outside services will be attached, so that an agent
# holds none of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
data:
  # What the proxy holds a credential for; scripts/deploy.sh reads these to
  # issue the certificate the proxy answers with.
  hosts: {{ $hosts | join " " | quote }}
  keys: {{ $keys | join " " | quote }}
  envoy.yaml: |
{{ include "egress.envoy" . | indent 4 }}
{{- if $renewals }}
---
# What a renewal has to keep between restarts, such as a sign-in.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egress-renewals
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.egress.renewalStorage }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: egress
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
    {{- if $trials }}
    # The model, for agents of trials in the sandbox, and nothing else.
    - name: model-trials
      port: {{ .Values.egress.model.trials.port }}
      targetPort: model-trials
    {{- end }}
---
{{ include "pod.account" (dict "name" "egress" "root" .) }}
{{- if $model }}
---
# The meter reads which pod has which address, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-meter
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-meter
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-meter
subjects:
  - kind: ServiceAccount
    name: egress
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $trials }}
---
# For trials: the meter reads which pod of the sandbox has which address,
# and what the pod says it is (its labels). Pods only, to read only, in that
# one namespace, where agents already may do everything with pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-meter-reads-trials
  namespace: {{ .Values.agent.sandbox.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-meter-reads-trials
  namespace: {{ .Values.agent.sandbox.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-meter-reads-trials
subjects:
  - kind: ServiceAccount
    name: egress
    namespace: {{ .Release.Namespace }}
---
# Out of the sandbox, a pod that says it reaches the model reaches the
# meter's port for trials, and nothing else of the installation's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trial-agents-reach-the-model
  namespace: {{ .Values.agent.sandbox.namespace }}
spec:
  podSelector:
    matchLabels:
      reaches-the-model: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app: egress
      ports:
        - {protocol: TCP, port: {{ .Values.egress.model.trials.port }}}
{{- end }}
---
# Who reaches the proxy, which puts a credential on what it passes: the
# pods that leave through it (agents and the jobs beside them), on its
# port, and nobody else, in this namespace or outside it. Whether or not
# the namespace is isolated: this is the one pod here that must never be
# open to the cluster.{{ if $trials }} And agents of trials in the sandbox, on the
# meter's port for them, which serves the model only.{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-admits-only-agents
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: egress
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent
      ports:
        - {protocol: TCP, port: 3128}
    {{- if $trials }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.agent.sandbox.namespace | quote }}
          podSelector:
            matchLabels:
              reaches-the-model: "true"
      ports:
        - {protocol: TCP, port: {{ .Values.egress.model.trials.port }}}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  {{- if $renewals }}
  # Never two at once: a renewal's sign-in may be good for one use only.
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      app: egress
  template:
    metadata:
      labels:
        app: egress
        {{- if $model }}
        # To the dispatcher, this pod is the meter of model use (ADR 0050).
        dispatcher-role: meter
        {{- end }}
        {{- with (include "pod.labels" .) }}{{ . | trim | nindent 8 }}{{- end }}
      annotations:
        # A changed configuration restarts the proxy.
        checksum/config: {{ include "egress.envoy" . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: egress
      {{- if $model }}
      # Time for the meter, told to end, to wait for answers under way and
      # send what it holds (METER_DRAIN and METER_FINAL), while the
      # dispatcher may be restarting too.
      terminationGracePeriodSeconds: 40
      {{- end }}
      automountServiceAccountToken: false
      {{- with (include "pod.placement" .) }}{{ . | trim | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if $renewals }}
        fsGroup: 10001
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      {{- if $renewals }}
      initContainers:
        # The proxy will not start without a file for each credential; the
        # renewal puts the real value in its place within seconds.
        - name: renewed-placeholders
          image: {{ .Values.egress.renewalImage | default (required "agent.image is required" .Values.agent.image) }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "for key in {{ $renewed | join " " }}; do renew-credential --write $key 'Bearer not-renewed-yet'; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renewed
              mountPath: /renewed
      {{- end }}
      containers:
        {{- range $renewals }}
        # Renews one credential: runs the command again and again and hands
        # what it prints to the proxy. What the command needs to keep (a
        # sign-in) is in its home, which no agent can reach.
        - name: renew-{{ .key }}
          image: {{ $.Values.egress.renewalImage | default (required "agent.image is required" $.Values.agent.image) }}
          imagePullPolicy: IfNotPresent
          command: ["renew-credential", {{ .key | quote }}, {{ .every | default 120 | quote }}, "--"]
          args: {{ toJson .command }}
          env:
            - name: HOME
              value: /home/agent
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renewed
              mountPath: /renewed
            - name: renewals-home
              mountPath: /home/agent
              subPath: {{ .key }}
        {{- end }}
        {{- if $model }}
        # The meter (ADR 0050): the proxy hands it every request to the
        # model's API with the address it came from. It refuses an address
        # that is no agent's pod, puts the model's credential on the rest,
        # and records what each pod used, in the dispatcher's log. Only this
        # container has the credential; agents reach the proxy's port and
        # nothing else in this pod, and the meter answers only inside it.
        - name: meter
          image: {{ .Values.egress.model.image | default (required "dispatcher.image is required" .Values.dispatcher.image) }}
          imagePullPolicy: IfNotPresent
          command: ["dispatcher", "meter"]
          env:
            - name: METER_LISTEN
              value: "127.0.0.1:{{ .Values.egress.model.port }}"
            - name: METER_UPSTREAM
              value: {{ .Values.egress.model.upstream | default (printf "https://%s" .Values.egress.model.host) | quote }}
            {{- if hasPrefix "http://" (.Values.egress.model.upstream | default "") }}
            # In the clear, to an address inside the cluster: a trial's
            # stand-in for the model, or the installation's meter for trials.
            - name: METER_UPSTREAM_PLAIN
              value: "on"
            {{- end }}
            - name: METER_CREDENTIAL_FILE
              value: /etc/meter/credential/token
            {{- with .Values.egress.model.accounts }}
            {{- if .enabled }}
            # Several accounts: the secret's keys account.NAME beside the
            # one credential, and the meter switches between them.
            - name: METER_ACCOUNTS
              value: "on"
            - name: METER_ACCOUNT_READ_MODEL
              value: {{ .readModel | quote }}
            - name: METER_ACCOUNT_CEILING
              value: {{ .fiveHourCeiling | quote }}
            - name: METER_ACCOUNT_HOLD
              value: {{ .hold | quote }}
            - name: METER_ACCOUNT_READ
              value: {{ .readEvery | quote }}
            {{- end }}
            {{- end }}
            - name: METER_IDLE
              value: {{ .Values.egress.model.idle | quote }}
            - name: METER_LONGEST
              value: {{ .Values.egress.model.longest | quote }}
            {{- if .Values.egress.model.shapes }}
            - name: METER_SHAPES
              value: "on"
            {{- end }}
            {{- if $trials }}
            - name: METER_TRIAL_LISTEN
              value: ":{{ .Values.egress.model.trials.port }}"
            - name: METER_TRIAL_NAMESPACE
              value: {{ .Values.agent.sandbox.namespace | quote }}
            - name: METER_TRIAL_MODELS
              value: {{ join "," (.Values.egress.model.trials.models | default (list .Values.usage.model)) | quote }}
            - name: METER_TRIAL_REQUESTS
              value: {{ .Values.egress.model.trials.requests | quote }}
            {{- end }}
            {{- if .Values.dispatcher.enabled }}
            - name: DISPATCHER_URL
              value: http://dispatcher.{{ .Release.Namespace }}.svc:{{ .Values.dispatcher.service.port }}
            - name: DISPATCHER_TOKEN_FILE
              value: /var/run/secrets/dispatcher/token
            {{- end }}
          {{- if $trials }}
          ports:
            - name: model-trials
              containerPort: {{ .Values.egress.model.trials.port }}
          {{- end }}
          resources:
            {{- toYaml .Values.egress.model.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-credential
              mountPath: /etc/meter/credential
              readOnly: true
            # The pod's account, to read which pod has which address; the
            # rest of the pod has no account token.
            - name: meter-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if .Values.dispatcher.enabled }}
            - name: dispatcher-identity
              mountPath: /var/run/secrets/dispatcher
              readOnly: true
            {{- end }}
        {{- end }}
        - name: envoy
          image: {{ .Values.egress.image }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          {{- if $model }}
          # Told to end, the proxy stays for as long as the meter waits for
          # answers under way (METER_DRAIN): they pass through it, and
          # were cut with it otherwise (ADR 0072).
          lifecycle:
            preStop:
              sleep: {seconds: 10}
          {{- end }}
          ports:
            - name: proxy
              containerPort: 3128
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
            {{- if $renewals }}
            - name: renewed
              mountPath: /etc/envoy/renewed
              readOnly: true
            {{- end }}
            {{- if $creds }}
            - name: credentials
              mountPath: /etc/envoy/credentials
              readOnly: true
            {{- end }}
            {{- if or $creds $model }}
            - name: tls
              mountPath: /etc/envoy/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: egress
        {{- if $renewals }}
        - name: renewed
          emptyDir: {medium: Memory}
        - name: renewals-home
          persistentVolumeClaim:
            claimName: egress-renewals
        {{- end }}
        {{- if $creds }}
        # One key for each host, holding the whole header value, for example
        # "Bearer ...". Put there by a pipe (scripts/deploy.sh CONTEXT secret).
        - name: credentials
          secret:
            secretName: {{ .Values.egress.credentialsSecret }}
        {{- end }}
        {{- if or $creds $model }}
        # The certificate the proxy answers with, issued by scripts/deploy.sh
        # from an authority of this installation.
        - name: tls
          secret:
            secretName: egress-tls
        {{- end }}
        {{- if $model }}
        - name: model-credential
          secret:
            secretName: {{ .Values.agent.modelSecret }}
            {{- if not .Values.egress.model.accounts.enabled }}
            items: [{key: token, path: token}]
            {{- end }}
        - name: meter-account
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        {{- if .Values.dispatcher.enabled }}
        # A token the cluster makes for this pod to show the dispatcher,
        # which knows it as the meter by the pod's label.
        - name: dispatcher-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: dispatcher
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- end }}
---
# An agent pod may talk to the memory service, the egress proxy and the
# cluster's name service, and to nothing else: whatever it calls outside the
# cluster goes through the proxy or does not go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-leave-through-the-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: egress
      ports:
        - {protocol: TCP, port: 3128}
    - to:
        - podSelector:
            matchLabels:
              app: cmem
      ports:
        - {protocol: TCP, port: 8377}
    {{- if .Values.dispatcher.enabled }}
    # The dispatcher, to emit events (the agent role) and, for the backup, to
    # read its dump.
    - to:
        - podSelector:
            matchLabels:
              app: dispatcher
      ports:
        - {protocol: TCP, port: {{ .Values.dispatcher.service.port }}}
    {{- end }}
    - to:
        {{- include "dns.peers" . | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- $sandbox := .Values.agent.sandbox.namespace }}
    {{- $reached := .Values.agent.namespaces }}
    {{- if $sandbox }}{{- $reached = append $reached $sandbox }}{{- end }}
    {{- with $reached }}
    # The pods of other namespaces the installation names: services it runs
    # on the cluster for its agents, and the namespace where agents run
    # their own. Any port; what is there decides what it answers.
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- if and $sandbox .Values.agent.sandbox.api.addresses }}
    # The cluster's API, where an agent is somebody only in that namespace.
    - to:
        {{- range .Values.agent.sandbox.api.addresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.agent.sandbox.api.port }}}
    {{- end }}
{{- if .Values.egress.closedTo }}
---
# The proxy goes out to the world and to nothing private. Without this an
# agent could ask it for a tunnel to another workload on the cluster or to an
# address on the cluster's own network, and "only through the proxy" would
# mean "anywhere the proxy can go".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-reaches-only-the-outside
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: egress
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- include "dns.peers" . | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if $model }}
    # The meter (ADR 0050): the dispatcher, where it records model use, and
    # the cluster's API, where it reads which pod has which address.
    {{- if .Values.dispatcher.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: dispatcher
      ports:
        - {protocol: TCP, port: {{ .Values.dispatcher.service.port }}}
    {{- end }}
    {{- with .Values.agent.sandbox.api.addresses }}
    - to:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.agent.sandbox.api.port }}}
    {{- end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.egress.closedTo | nindent 14 }}
{{- end }}
{{- end }}
