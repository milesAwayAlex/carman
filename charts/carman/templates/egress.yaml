{{- if .Values.egress.enabled }}
# The egress proxy: the one way out of the cluster for agent pods (ADR 0031).
# Today it passes every connection through and logs where it went. It is
# where credentials for outside services will be attached, so that an agent
# holds none of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: {address: 0.0.0.0, port_value: 3128}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress
                    # One line for each connection an agent opened: when, to
                    # where, how it ended, how long it was open and how much
                    # went each way. Never what was said.
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "%START_TIME% egress from=%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% %REQ(:METHOD)% %REQ(:AUTHORITY)% status=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% ms=%DURATION% sent=%BYTES_RECEIVED% received=%BYTES_SENT%\n"
                    route_config:
                      name: out
                      virtual_hosts:
                        - name: anywhere
                          domains: ["*"]
                          routes:
                            # HTTPS: the client asks for a tunnel to a host.
                            - match: {connect_matcher: {}}
                              route:
                                cluster: outside
                                timeout: 0s
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match: {prefix: "/"}
                              route: {cluster: outside, timeout: 0s}
                    http_filters:
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: {name: outside, dns_lookup_family: V4_ONLY}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    upgrade_configs:
                      - upgrade_type: CONNECT
      clusters:
        - name: outside
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: {name: outside, dns_lookup_family: V4_ONLY}
---
apiVersion: v1
kind: Service
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: egress
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress
  template:
    metadata:
      labels:
        app: egress
      annotations:
        # A changed configuration restarts the proxy.
        checksum/config: {{ .Values.egress | toJson | sha256sum | trunc 16 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: envoy
          image: {{ .Values.egress.image }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - name: proxy
              containerPort: 3128
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config
          configMap:
            name: egress
---
# An agent pod may talk to the memory service, the egress proxy and the
# cluster's name service, and to nothing else: whatever it calls outside the
# cluster goes through the proxy or does not go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-leave-through-the-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      carman/role: agent
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: egress
      ports:
        - {protocol: TCP, port: 3128}
    - to:
        - podSelector:
            matchLabels:
              app: cmem
      ports:
        - {protocol: TCP, port: 8377}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
