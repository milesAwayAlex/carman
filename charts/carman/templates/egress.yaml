{{- if .Values.egress.enabled }}
{{- $creds := .Values.egress.credentials }}
{{- $renewals := .Values.egress.renewals }}
{{- $renewed := list }}{{- range $renewals }}{{- $renewed = append $renewed .key }}{{- end }}
{{- $hosts := list }}{{- $keys := list }}
{{- range $creds }}{{- $hosts = append $hosts .host }}{{- if not (has .key $renewed) }}{{- $keys = append $keys .key }}{{- end }}{{- end }}
# The egress proxy: the one way out of the cluster for agent pods (ADR 0031).
# Today it passes every connection through and logs where it went. It is
# where credentials for outside services will be attached, so that an agent
# holds none of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
data:
  # What the proxy holds a credential for; scripts/deploy.sh reads these to
  # issue the certificate the proxy answers with.
  hosts: {{ $hosts | join " " | quote }}
  keys: {{ $keys | join " " | quote }}
  envoy.yaml: |
{{ include "egress.envoy" . | indent 4 }}
{{- if $renewals }}
---
# What a renewal has to keep between restarts, such as a sign-in.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egress-renewals
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.egress.renewalStorage }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: egress
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
---
{{ include "pod.account" (dict "name" "egress" "root" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  {{- if $renewals }}
  # Never two at once: a renewal's sign-in may be good for one use only.
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      app: egress
  template:
    metadata:
      labels:
        app: egress
        {{- with (include "pod.labels" .) }}{{ . | trim | nindent 8 }}{{- end }}
      annotations:
        # A changed configuration restarts the proxy.
        checksum/config: {{ include "egress.envoy" . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: egress
      automountServiceAccountToken: false
      {{- with (include "pod.placement" .) }}{{ . | trim | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if $renewals }}
        fsGroup: 10001
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      {{- if $renewals }}
      initContainers:
        # The proxy will not start without a file for each credential; the
        # renewal puts the real value in its place within seconds.
        - name: renewed-placeholders
          image: {{ required "agent.image is required" .Values.agent.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "for key in {{ $renewed | join " " }}; do renew-credential --write $key 'Bearer not-renewed-yet'; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renewed
              mountPath: /renewed
      {{- end }}
      containers:
        {{- range $renewals }}
        # Renews one credential: runs the command again and again and hands
        # what it prints to the proxy. What the command needs to keep (a
        # sign-in) is in its home, which no agent can reach.
        - name: renew-{{ .key }}
          image: {{ required "agent.image is required" $.Values.agent.image }}
          imagePullPolicy: IfNotPresent
          command: ["renew-credential", {{ .key | quote }}, {{ .every | default 120 | quote }}, "--"]
          args: {{ toJson .command }}
          env:
            - name: HOME
              value: /home/agent
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renewed
              mountPath: /renewed
            - name: renewals-home
              mountPath: /home/agent
              subPath: {{ .key }}
        {{- end }}
        - name: envoy
          image: {{ .Values.egress.image }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - name: proxy
              containerPort: 3128
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
            {{- if $renewals }}
            - name: renewed
              mountPath: /etc/envoy/renewed
              readOnly: true
            {{- end }}
            {{- if $creds }}
            - name: credentials
              mountPath: /etc/envoy/credentials
              readOnly: true
            - name: tls
              mountPath: /etc/envoy/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: egress
        {{- if $renewals }}
        - name: renewed
          emptyDir: {medium: Memory}
        - name: renewals-home
          persistentVolumeClaim:
            claimName: egress-renewals
        {{- end }}
        {{- if $creds }}
        # One key for each host, holding the whole header value, for example
        # "Bearer ...". Put there by a pipe (scripts/deploy.sh CONTEXT secret).
        - name: credentials
          secret:
            secretName: {{ .Values.egress.credentialsSecret }}
        # The certificate the proxy answers with, issued by scripts/deploy.sh
        # from an authority of this installation.
        - name: tls
          secret:
            secretName: egress-tls
        {{- end }}
---
# An agent pod may talk to the memory service, the egress proxy and the
# cluster's name service, and to nothing else: whatever it calls outside the
# cluster goes through the proxy or does not go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-leave-through-the-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: egress
      ports:
        - {protocol: TCP, port: 3128}
    - to:
        - podSelector:
            matchLabels:
              app: cmem
      ports:
        - {protocol: TCP, port: 8377}
    - to:
        {{- include "dns.peers" . | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- $sandbox := .Values.agent.sandbox.namespace }}
    {{- $reached := .Values.agent.namespaces }}
    {{- if $sandbox }}{{- $reached = append $reached $sandbox }}{{- end }}
    {{- with $reached }}
    # The pods of other namespaces the installation names: services it runs
    # on the cluster for its agents, and the namespace where agents run
    # their own. Any port; what is there decides what it answers.
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- if and $sandbox .Values.agent.sandbox.api.addresses }}
    # The cluster's API, where an agent is somebody only in that namespace.
    - to:
        {{- range .Values.agent.sandbox.api.addresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.agent.sandbox.api.port }}}
    {{- end }}
{{- if .Values.egress.closedTo }}
---
# The proxy goes out to the world and to nothing private. Without this an
# agent could ask it for a tunnel to another workload on the cluster or to an
# address on the cluster's own network, and "only through the proxy" would
# mean "anywhere the proxy can go".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-reaches-only-the-outside
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: egress
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- include "dns.peers" . | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.egress.closedTo | nindent 14 }}
{{- end }}
{{- end }}
