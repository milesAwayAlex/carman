{{- if .Values.backup.enabled }}
# A copy of the installation's state, put outside the cluster every night:
# the whole library, history included, and whatever else the values name.
# The copies go to a repository the platform gives (ADR 0038), and each
# stands by itself: `backup-state dump library` gives a file that
# `cmem restore FILE DIR` makes a library of, on any machine.
{{ include "pod.account" (dict "name" "backup" "root" . "annotations" .Values.backup.serviceAccountAnnotations) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: "Etc/UTC"
  startingDeadlineSeconds: {{ .Values.backup.catchUpSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    metadata:
      annotations:
        # It tells the owner of its own failure (backup-state): the
        # dispatcher does not tell them again, unless it was killed (ADR 0043).
        dispatcher/notifies-owner: "true"
    spec:
      # One try a night: a failure tells the owner, once.
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.backup.deadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.agent.keepFinishedSeconds }}
      template:
        metadata:
          labels:
            app: backup
            app.kubernetes.io/component: agent
            {{- with (include "pod.labels" .) }}{{ . | trim | nindent 12 }}{{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: backup
          automountServiceAccountToken: false
          {{- with (include "pod.placement" .) }}{{ . | trim | nindent 10 }}{{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: {{ required "agent.image is required" .Values.agent.image }}
              imagePullPolicy: IfNotPresent
              command: ["backup-state"]
              env:
                - name: CMEM_URL
                  value: http://cmem:{{ .Values.memory.service.port }}
                # Any role may read the whole library; this one can change
                # nothing that is in it.
                - name: CMEM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.memory.tokensSecret }}
                      key: worker
                - name: BACKUP_REPOSITORY
                  value: {{ required "backup.repository is required" .Values.backup.repository | quote }}
                # Without the password no copy can be read: it is kept
                # outside the cluster too, by whoever would restore.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secret }}
                      key: password
                # A store that wants keys; a cloud's bucket takes the
                # identity of the job's account instead.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secret }}
                      key: access-key-id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secret }}
                      key: secret-access-key
                      optional: true
                - name: BACKUP_KEEP
                  value: {{ .Values.backup.keep | quote }}
                {{- $also := .Values.backup.also }}
                {{- if and .Values.dispatcher.enabled (not .Values.dispatcher.database.host) }}
                # The dispatcher's database, as SQL: the service makes the dump
                # with a client of its server's version, and hands it to the
                # backup role. The token goes on standard input, not a command line.
                {{- $also = append $also (dict "name" "dispatcher" "command" (list "sh" "-c" (printf "printf 'Authorization: Bearer %%s' \"$DISPATCHER_BACKUP_TOKEN\" | curl -fsS --max-time 600 -H @- http://dispatcher:%v/v1/dump" .Values.dispatcher.service.port))) }}
                - name: DISPATCHER_BACKUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.dispatcher.tokensSecret }}
                      key: backup
                {{- end }}
                {{- if .Values.backup.installation }}
                # The installation's own definition, as a git bundle the
                # deploy put in the cluster.
                {{- $also = append $also (dict "name" "installation" "command" (list "cat" "/etc/installation/definition.bundle")) }}
                {{- end }}
                - name: BACKUP_ALSO
                  value: {{ $also | toJson | quote }}
                {{- range $name, $value := .Values.backup.env }}
                - name: {{ $name }}
                  value: {{ $value | quote }}
                {{- end }}
                {{- if .Values.egress.enabled }}
                - name: HTTPS_PROXY
                  value: http://egress:3128
                - name: NO_PROXY
                  value: cmem,dispatcher,localhost,127.0.0.1,metadata.google.internal,169.254.169.254{{ range .Values.agent.namespaces }},.{{ . }}{{ end }}{{ with .Values.backup.store.host }},{{ . }}{{ end }}
                - name: EGRESS_CA
                  value: /etc/agent/egress/ca.crt
                {{- end }}
              volumeMounts:
                - name: home
                  mountPath: /home/agent
                # The installation's commands: the one that tells the owner
                # a night's copy failed is among them, where there is one.
                - name: tools
                  mountPath: /etc/agent/bin
                  readOnly: true
                {{- if .Values.egress.enabled }}
                - name: egress-ca
                  mountPath: /etc/agent/egress
                  readOnly: true
                {{- end }}
                {{- if .Values.backup.installation }}
                - name: installation
                  mountPath: /etc/installation
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: home
              emptyDir: {}
            - name: tools
              configMap:
                name: tools
                optional: true
                defaultMode: 0555
            {{- if .Values.egress.enabled }}
            - name: egress-ca
              configMap:
                name: egress-ca
                optional: true
            {{- end }}
            {{- if .Values.backup.installation }}
            - name: installation
              configMap:
                name: installation
            {{- end }}
{{- if .Values.egress.enabled }}
---
# Beside what every agent pod may reach, the backup may ask the node for the
# cloud identity of its account. A managed cluster hands it out there, and
# only to the pod whose account was given one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-asks-for-its-identity
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: backup
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - ipBlock: {cidr: 169.254.169.252/32}
      ports:
        - {protocol: TCP, port: 988}
    {{- with .Values.backup.store.addresses }}
    # A store on the installation's own network, reached directly.
    - to:
        {{- range . }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.backup.store.port }}}
    {{- end }}
{{- end }}
{{- end }}
