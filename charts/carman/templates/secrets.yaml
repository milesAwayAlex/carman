{{- with .Values.externalSecrets }}
{{- if .enabled }}
# Where the cluster runs External Secrets Operator, the secrets this chart
# reads are made by it, and nobody puts them in by hand. The role tokens are
# three values; the list the service reads is put together from them here, so
# there is no fourth to drift.
{{- if .memoryTokens.generate }}
# Made in the cluster, once, and kept nowhere else: letters and digits only,
# because the service reads the list as role=token pairs between commas.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: role-token
  namespace: {{ $.Release.Namespace }}
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.memory.tokensSecret }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if .memoryTokens.generate }}
  # Never again: a new token under a running service would lock everyone out.
  refreshInterval: "0"
  {{- else }}
  refreshInterval: {{ .store.refreshInterval }}
  secretStoreRef:
    name: {{ .store.name }}
    kind: {{ .store.kind }}
  {{- end }}
  target:
    name: {{ $.Values.memory.tokensSecret }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        CMEM_TOKENS: {{ `"laptop={{ .laptop | trim }},worker={{ .worker | trim }},dreamer={{ .dreamer | trim }}"` }}
        laptop: {{ `"{{ .laptop | trim }}"` }}
        worker: {{ `"{{ .worker | trim }}"` }}
        dreamer: {{ `"{{ .dreamer | trim }}"` }}
  {{- if .memoryTokens.generate }}
  dataFrom:
    {{- range $role := list "laptop" "worker" "dreamer" }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: role-token
      rewrite:
        - regexp: {source: password, target: {{ $role }}}
    {{- end }}
  {{- else }}
  data:
    {{- range $role := list "laptop" "worker" "dreamer" }}
    - secretKey: {{ $role }}
      remoteRef:
        key: {{ required (printf "externalSecrets.memoryTokens.%s is required" $role) (index $.Values.externalSecrets.memoryTokens $role) }}
    {{- end }}
  {{- end }}
{{- with .modelCredential }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.agent.modelSecret }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.store.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.store.name }}
    kind: {{ $.Values.externalSecrets.store.kind }}
  target:
    name: {{ $.Values.agent.modelSecret }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        token: {{ `"{{ .token | trim }}"` }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ . }}
{{- end }}
{{- end }}
{{- end }}
