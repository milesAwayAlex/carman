# The memory service. Inside the cluster it is http://cmem:{{ .Values.memory.service.port }} in
# this namespace.
apiVersion: v1
kind: Service
metadata:
  name: cmem
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.memory.service.type }}
  selector:
    app: cmem
  ports:
    - name: http
      port: {{ .Values.memory.service.port }}
      targetPort: http
---
# One replica, and it must stay one: the service keeps the whole library in
# memory and serializes writes, so two instances on one library would diverge.
# What makes it resilient is not a second copy but a fast restart on a volume
# that outlives the pod: on start it clears stale locks and commits any note
# that was written and not yet recorded.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cmem
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: cmem
  replicas: 1
  selector:
    matchLabels:
      app: cmem
  template:
    metadata:
      labels:
        app: cmem
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cmem
          image: {{ required "memory.image is required" .Values.memory.image }}
          imagePullPolicy: IfNotPresent
          env:
            # A directory inside the volume, so that the service creates it and
            # owns it; git refuses to work in a repository someone else owns.
            - name: CMEM_LIBRARY
              value: /data/library
            - name: CMEM_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.memory.tokensSecret }}
                  key: CMEM_TOKENS
          ports:
            - name: http
              containerPort: 8377
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.memory.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.memory.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.memory.storage }}
