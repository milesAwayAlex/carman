# Values for the carman chart. scripts/deploy.sh sets the two images and
# keeps the dreamer's schedule as the cluster has it; everything else is here
# or in a values file for one kind of cluster (deploy/values/).

memory:
  # The image of the memory service. Required.
  image: ""
  # How much room the library's volume has. Notes are small; a gigabyte is
  # hundreds of thousands of them with their history.
  storage: 1Gi
  # The storage class of that volume; empty means the cluster's default.
  storageClass: ""
  # The secret holding the role tokens (keys CMEM_TOKENS, laptop, worker,
  # dreamer). scripts/deploy.sh makes it on the first deploy.
  tokensSecret: cmem-tokens
  service:
    # ClusterIP inside a cluster that has another way in. LoadBalancer where
    # the cluster's load balancer is how a laptop reaches the service.
    type: ClusterIP
    port: 8377
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 256Mi}

agent:
  # The agent image: the harness, the memory client and the routines. Required.
  image: ""
  # The secret holding the harness's model credential, under the key `token`.
  modelSecret: carman-model

dreamer:
  # Off until a model credential is in place; `scripts/deploy.sh CONTEXT
  # dreamer on` switches it and later deploys keep what the cluster has.
  suspend: true
  # Once a night, at an hour when nobody is working (UTC).
  schedule: "17 10 * * *"
  # In this order: tidy what is there, then distil finished documents.
  routines: [consolidate, distill]
  # The ladder: one attempt each, in this order (ADR 0029).
  models: [claude-sonnet-5-5, claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-1]
  # No further attempt at a routine starts once it has cost this much tonight.
  budgetUSD: 3
  deadlineSeconds: 1800
  # A night's run that was missed is still started up to this long after
  # its time; later than that, the next night's run is soon enough.
  catchUpSeconds: 43200
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

egress:
  # The proxy every agent pod leaves the cluster through (ADR 0031). With it
  # on, a network policy keeps agent pods from reaching anything else.
  enabled: true
  image: envoyproxy/envoy:v1.33.0
  # The hosts the proxy adds a credential for, and the key of each in the
  # secret below. For these the proxy answers in the host's name, so an
  # agent needs no credential of its own and cannot read this one.
  #   credentials:
  #     - {host: api.example.com, key: example}
  credentials: []
  credentialsSecret: carman-egress
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

# Agents beyond the dreamer. Each runs its routines in the agent image, as a
# working agent in memory, leaving the cluster only through the egress proxy.
#   agents:
#     - name: example
#       routines: [example]           # in the image, or put in the cluster with
#                                     # scripts/deploy.sh CONTEXT routine FILE
#       schedule: "0 15 * * 1"        # optional; without it, runs only when asked
#       catchUpSeconds: 172800        # how late a missed run may still start (a day, unless said)
#       models: [claude-sonnet-5-5]   # the ladder
#       budgetUSD: 2
#       tools: all                    # "memory" (the default): the memory command only
#       scope: repo:example.com/org/name   # which repository's memory it works with
#       mcp: {tracker: https://mcp.example.com/mcp}
#       google: true                  # give it the cloud identity below
agents: []

cloud:
  # The cloud identity an agent pod can take, with no stored key: the pod's
  # own token, signed by this cluster, is exchanged for a short-lived one of
  # a service account. On a managed cluster of the same provider the
  # provider's workload identity does this by itself and these stay empty.
  google:
    # The identity provider that trusts this cluster's tokens, by its full
    # resource name (//iam.googleapis.com/projects/NUMBER/locations/global/
    # workloadIdentityPools/POOL/providers/PROVIDER).
    audience: ""
    # The service account an agent acts as.
    serviceAccount: ""
